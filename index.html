<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Терра CRM — облачная CRM для сферы услуг</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">Т</div>
      <div class="brand-text">
        <div class="brand-name">Терра CRM</div>
        <div class="brand-sub">облачная платформа</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a class="nav-item" data-view="dashboard">
        <span class="ico">▤</span><span>Дашборд</span>
      </a>
      <a class="nav-item" data-view="requests">
        <span class="ico">✉</span><span>Заявки</span><span class="badge" id="badge-requests">12</span>
      </a>
      <a class="nav-item" data-view="clients">
        <span class="ico">◎</span><span>Клиенты</span>
      </a>
      <a class="nav-item" data-view="deals">
        <span class="ico">▦</span><span>Сделки</span>
      </a>
      <a class="nav-item" data-view="tasks">
        <span class="ico">✓</span><span>Задачи</span>
      </a>
      <a class="nav-item" data-view="reports">
        <span class="ico">◔</span><span>Отчёты</span>
      </a>
      <div class="nav-sep">Управление</div>
      <a class="nav-item" data-view="team">
        <span class="ico">⚇</span><span>Сотрудники</span>
      </a>
      <a class="nav-item" data-view="settings">
        <span class="ico">⚙</span><span>Настройки</span>
      </a>
    </nav>

    <div class="sidebar-card">
      <div class="sidebar-card-title">Тариф «Бизнес»</div>
      <div class="sidebar-card-text">15 из 25 пользователей</div>
      <div class="progress"><span style="width:60%"></span></div>
      <button class="btn btn-ghost btn-block">Увеличить лимит</button>
    </div>

    <div class="sidebar-user">
      <div class="avatar">АК</div>
      <div class="su-text">
        <div class="su-name">Анна Ковалёва</div>
        <div class="su-role">Руководитель отдела</div>
      </div>
      <span class="dot-online"></span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb">
        <span id="crumb-root">Терра CRM</span>
        <span class="crumb-sep">/</span>
        <strong id="crumb-current">Дашборд</strong>
      </div>
      <div class="topbar-actions">
        <div class="search">
          <span class="search-ico">⌕</span>
          <input id="global-search" type="text" placeholder="Поиск по клиентам, заявкам, договорам…">
          <kbd>Ctrl K</kbd>
        </div>
        <button class="icon-btn" title="Уведомления">🔔<span class="dot-badge"></span></button>
        <button class="btn btn-primary" id="btn-create">＋ Создать</button>
      </div>
    </header>

    <main class="content" id="view"></main>
  </div>
</div>

<div class="drawer-overlay" id="drawer-overlay"></div>
<aside class="drawer" id="drawer"></aside>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
